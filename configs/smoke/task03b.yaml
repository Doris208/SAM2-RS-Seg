seed: 42
model:
  name: SAM2SemanticSegmentor
  params:
    num_classes: 6
    head_channels: 128
    pretrained: true
    checkpoint_path: null  # Set by --checkpoint, never silently randomized.
    sam2_config: configs/sam2.1/sam2.1_hiera_t.yaml
    device: cpu  # Trainer controls placement.
  decode_head: null  # Preserve the verified 03A head by default.
data:
  input_channels: 3
  num_classes: 6
  image_size: [256, 256]
  ignore_index: 255
  ignore_fraction: 0.05
  batch_size: 1
  num_workers: 0
  pin_memory: true
  train_samples: 2
  val_samples: 2
  test_samples: 2
loss:
  name: CrossEntropyLoss
  ignore_index: 255
optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 0.00000001
  foreach: false
scheduler:
  name: PolynomialLR
  interval: step
  total_iters: 4
  power: 0.9
trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_steps: 4
  max_epochs: -1
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  deterministic: true
  benchmark: false
  log_every_n_steps: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_progress_bar: false
  enable_model_summary: false
evaluation:
  absent_class: exclude
checkpoint:
  monitor: val_mIoU
  mode: max
  save_top_k: 1
  save_last: true
